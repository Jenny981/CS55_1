[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs55-1-demo"
version = "0.1.0"
description = "CS55-1 cross-modal evidence-chain demo using the project-provided libevchain framework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.1",
  "transformers>=4.40",
  "pymupdf>=1.24",
  "opencv-python>=4.10"
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
